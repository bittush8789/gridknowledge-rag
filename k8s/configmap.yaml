apiVersion: v1
kind: ConfigMap
metadata:
  name: gridknowledge-config
  namespace: gridknowledge
  labels:
    app.kubernetes.io/name: gridknowledge-rag
    app.kubernetes.io/component: backend
data:
  APP_ENV: "production"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  DATABASE_URL: "sqlite:///data/gridknowledge.db"
  GROQ_MODEL: "llama-3.3-70b-versatile"
  OPENAI_MODEL: "gpt-4o-mini"
  PINECONE_INDEX: "gridknowledge-rag"
  PINECONE_ENVIRONMENT: "us-east-1"
  LANGCHAIN_TRACING_V2: "false"
  LANGCHAIN_PROJECT: "gridknowledge-rag"
  MAX_QUERY_LENGTH: "1000"
  MIN_QUERY_LENGTH: "2"
  ENABLE_PROMPT_INJECTION_DEFENSE: "true"
  ENABLE_JAILBREAK_DETECTION: "true"
  ENABLE_PII_MASKING: "true"
  ENABLE_DATA_LEAKAGE_PREVENTION: "true"
  ENABLE_OUTPUT_GROUNDING_CHECK: "true"
