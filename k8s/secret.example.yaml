# Template for GridKnowledge Credentials
# Copy this file to k8s/secret.yaml, replace placeholders with real keys, then apply:
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: gridknowledge-secrets
  namespace: gridknowledge
  labels:
    app.kubernetes.io/name: gridknowledge-rag
type: Opaque
stringData:
  SECRET_KEY: "change-this-to-a-secure-random-secret-key"
  JWT_SECRET: "change-this-to-a-secure-jwt-signing-secret"
  GROQ_API_KEY: "gsk_your_groq_api_key_here"
  OPENAI_API_KEY: "sk-proj-your_openai_api_key_here"
  PINECONE_API_KEY: "your_pinecone_api_key_here"
  LANGCHAIN_API_KEY: ""
